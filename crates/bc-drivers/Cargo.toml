[package]
name = "bc-drivers"
description = "BurnCraft: Sterowniki laserow (trait Driver), transporty i kompilatory plikow maszynowych (G-code)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bc-geom.workspace = true
bc-doc.workspace = true
bc-plan.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde_json.workspace = true
schemars = "1"
tungstenite.workspace = true
serialport = "4"
nusb = "0.2.9"

# Windows: urządzenia USB bez sterownika (kreator „Znajdź mój laser”); ta sama wersja i
# funkcje co w nusb — bez nowych pakietów.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation"] }

[dev-dependencies]
bc-geom.workspace = true
tiny-skia.workspace = true
bc-sim.workspace = true