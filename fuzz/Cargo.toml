[package]
name = "bc-io-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bc-io = { path = "../crates/bc-io" }

# samodzielny projekt (poza workspace) — budowany przez `cargo fuzz` na nightly
[workspace]

[[bin]]
name = "svg_import"
path = "fuzz_targets/svg_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_import"
path = "fuzz_targets/dxf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lbrn2_import"
path = "fuzz_targets/lbrn2_import.rs"
test = false
doc = false
bench = false
