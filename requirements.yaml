# BurnCraft — rejestr wymagan (jedyne zrodlo prawdy o zakresie, spec. sekcja 21.1)
# Pola: id, sec (sekcja spec.), pri (MUST/SHOULD/LATER), ms (etap M0-M7/LATER),
#       verify (auto=test automatyczny, emu=emulator, hw=sprzet, manual=przeglad reczny),
#       status (todo/in_progress/done/verified/deviation), text, opcjonalnie: postulat (glosy),
#       conflict (konflikt priorytetu sekcja vs. sekcja 17), tests, code, procedure, deviation.
requirements:
  - {id: "REQ-00-001", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Aplikacja desktopowa CAD/CAM 2D do przygotowania projektow i bezposredniego sterowania laserami diodowymi"}
  - {id: "REQ-00-002", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Obsluga laserow CO2 portalowych"}
  - {id: "REQ-00-003", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Obsluga laserow galvo: swiatlowodowych, UV i CO2"}
  - {id: "REQ-00-004", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Pelny zakres funkcji profesjonalnego programu do laserow (edycja, ustawienia ciecia, podglad, sterowanie maszyna, kamery, tryby specjalne) — wymaganie nadrzedne, rozbite w sekcjach 2-13"}
  - {id: "REQ-00-005", sec: "0", pri: "MUST", ms: "M6", verify: "auto", status: "todo", text: "Wbudowany serwer MCP umozliwiajacy agentowi AI projektowanie, przygotowanie i (po spelnieniu warunkow bezpieczenstwa) wykonanie zadan"}
  - {id: "REQ-00-006", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Obsluga wszystkich popularnych sterownikow, w tym K40 Lihuiyu M2/M3 Nano, DSP Ruida/Trocen/TopWisdom/Leetro/Moshi, rodzina G-code, galvo EZCAD2/EZCAD3/BSL — nadrzedne, rozbite w sekcji 13", note: "bez Ruidy - decyzja zleceniodawcy 2026-11-07 (DEV-007)", deviation: "DEV-007"}
  - {id: "REQ-00-007", sec: "0", pri: "MUST", ms: "M7", verify: "auto", status: "todo", text: "Dzialanie na Windows 10+"}
  - {id: "REQ-00-008", sec: "0", pri: "MUST", ms: "M7", verify: "auto", status: "todo", text: "Dzialanie na macOS 11+ x64"}
  - {id: "REQ-00-009", sec: "0", pri: "MUST", ms: "M7", verify: "auto", status: "todo", text: "Dzialanie na macOS 11+ Apple Silicon"}
  - {id: "REQ-00-010", sec: "0", pri: "MUST", ms: "M7", verify: "auto", status: "todo", text: "Dzialanie na Linux x64"}
  - {id: "REQ-00-011", sec: "0", pri: "MUST", ms: "M7", verify: "auto", status: "todo", text: "Dzialanie na Linux ARM64"}
  - {id: "REQ-00-012", sec: "0", pri: "MUST", ms: "M7", verify: "hw", status: "todo", text: "Dzialanie na Raspberry Pi 4/5"}
  - {id: "REQ-00-013", sec: "0", pri: "MUST", ms: "M7", verify: "manual", status: "todo", text: "Realizacja niezrealizowanych postulatow spolecznosci (sekcja 17) — nadrzedne"}
  - {id: "REQ-00-014", sec: "0", pri: "MUST", ms: "M0", verify: "manual", status: "verified", text: "Clean-room: brak dekompilacji, deasemblacji i kopiowania kodu, ikon, tekstow, dokumentacji i zasobow innych programow do laserow", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-00-015", sec: "0", pri: "MUST", ms: "M0", verify: "manual", status: "verified", text: "Wlasna nazwa, wlasna identyfikacja wizualna i wlasne ikony", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-00-016", sec: "0", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Wlasny natywny format pliku (nie format .lbrn/.lbrn2)"}
  - {id: "REQ-00-017", sec: "0", pri: "MUST", ms: "M1", verify: "manual", status: "verified", text: "Interoperacyjnosc (.lbrn/.lbrn2/.clb/.lbart/.lbzip) implementowana wylacznie na podstawie analizy plikow uzytkownika, nie kodu programow, ktore je zapisuja", procedure: "docs/procedures/M1-manual-checks.md"}
  - {id: "REQ-00-018", sec: "0", pri: "MUST", ms: "M3", verify: "manual", status: "verified", text: "Wiedza o protokolach sterownikow wylacznie z publicznych, otwartych zrodel z poszanowaniem licencji", note: "ADR 0013 (zrodla wiedzy: publiczne opisy i otwarte projekty tylko jako wiedza, bez kopiowania kodu, odnosniki w kodzie), THIRD_PARTY.md sekcja zrodel z licencjami; procedura reczna (M3.1) zgodna - powtorzyc w M3.2/M3.3", procedure: "docs/procedures/M3-gui-checks.md"}
  - {id: "REQ-00-019", sec: "0", pri: "MUST", ms: "M0", verify: "manual", status: "verified", text: "Plik THIRD_PARTY.md dokumentuje kazde wykorzystane zrodlo wiedzy i biblioteke", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-00-020", sec: "0", pri: "MUST", ms: "M0", verify: "manual", status: "verified", text: "Licencja: GPL-3.0-or-later dla aplikacji, MIT/Apache-2.0 dla rdzenia i SDK wtyczek, uzasadnienie w docs/adr/0001-license.md", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-001", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Rdzen bezglowy (headless) — dziala bez GUI", tests: ["req_15_001_headless_stdio_and_malformed_input"]}
  - {id: "REQ-01-002", sec: "1.1", pri: "MUST", ms: "M6", verify: "auto", status: "todo", text: "GUI, CLI, serwer MCP i klient webowy sa cienkimi warstwami nad tym samym API polecen"}
