  - {id: "REQ-01-004", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-doc istnieje w workspace jako osobny modul; zakres: model dokumentu, warstwy, obiekty, undo/redo (command pattern), serializacja .bcraft", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-005", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-text istnieje w workspace jako osobny modul; zakres: fonty TTF/OTF/SHX/Hershey/jednokreskowe, shaping HarfBuzz, tekst zmienny", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-006", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-image istnieje w workspace jako osobny modul; zakres: przetwarzanie rastrow, dithering, trasowanie, maski", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-007", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-io istnieje w workspace jako osobny modul; zakres: import/eksport formatow plikow", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-008", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-plan istnieje w workspace jako osobny modul; zakres: planer ciecia (kolejnosc, optymalizacja, kerf, mostki, overscan, wypelnienia, rastry)", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-009", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-sim istnieje w workspace jako osobny modul; zakres: symulacja/podglad sciezek, estymacja czasu z modelem przyspieszen", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-010", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-drivers istnieje w workspace jako osobny modul; zakres: sterowniki (trait Driver) i transporty", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-011", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-camera istnieje w workspace jako osobny modul; zakres: kamery, kalibracja, wyrownanie, AprilTag/ArUco", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-012", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-materials istnieje w workspace jako osobny modul; zakres: biblioteka materialow, testy materialowe", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-013", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-commands istnieje w workspace jako osobny modul; zakres: rejestr polecen (id, schemat JSON parametrow, undo)", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-014", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-mcp istnieje w workspace jako osobny modul; zakres: serwer MCP (stdio + Streamable HTTP), zasoby, prompty, polityka bezpieczenstwa", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-015", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-script istnieje w workspace jako osobny modul; zakres: API skryptowe (Python + JS/Lua), system wtyczek", procedure: "docs/procedures/M0-manual-checks.md"}
  - {id: "REQ-01-016", sec: "1.1", pri: "MUST", ms: "M0", verify: "auto", status: "verified", text: "Crate bc-cli istnieje w workspace jako osobny modul; zakres: burncraft-cli (operacje wsadowe, konwersja, wysylka zadan, mcp --connect)", procedure: "docs/procedures/M0-manual-checks.md"}
